authConfig = {
  jwtConfig = {
    privateKey = ${ODIN_PRIVATE_KEY}
    publicKey =  ${ODIN_PUBLIC_KEY}
    expirationMillis = 3600000
  }
}

odinAccountManagerConfig = {
  host = "127.0.0.1",
  port = 8080
  channel = PLAINTEXT
}

logStoreConfig {
  host = "localhost",
  port = 9443,
  enableSSL = false,
  username = "dummy",
  password = "dummy",
  pollingFrequencySeconds = 2
  batchSize = 50
  retryCount = 3
  retryIntervalSeconds = 2
}

mysql = {
  master = {
    poolOptions = {
      maxSize = 5
    }
  }
  slave = {
    poolOptions = {
      maxSize = 5
    }
  }
}

webclient = {
  idleTimeout = 60
  maxPoolSize = 32
  logActivity = false
  keepAliveTimeout = 6
  tcpKeepAlive = true
  http2KeepAliveTimeout = 6
  useAlpn = true
}

envDbStatusCheckIntervalSecs = 5
serviceDbStatusCheckIntervalSecs = 1

queue = {
  request = {
    queueProvider = "sqs"
    region = "us-east-1"
  }
  response = {
    queueProvider = "sqs"
    region = "us-east-1"
    receiveConfig = {
      maxMessages = 5
    }
  }
}

interceptors = {
  component = []
  config = {
    timeout = 1
    retryCount = 2
  }
}
